<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <title>Pasapalabra</title>
</head>
<body>

    <section id="pantalla-inicial">
        <h1>PASAPALABRA</h1>
        <button id="comenzar">Comenzar Juego</button>
    </section>

    <section id="pantalla-juego">
        <div class="container">
            <span id="tiempo">60</span>
            </div>
        <div class="contenedor-pregunta">
            <span id="letra-pregunta">A</span>
            <h2 id="pregunta">Esta es la pregunta...</h2>
            <input type="text" id="respuesta" placeholder="Escribe tu respuesta">
            <div class="botones">
                <button id="responder">Responder</button>
                <button id="pasar">Pasa Palabra</button>
            </div>
        </div>
    </section>

    <section id="pantalla-final" style="display: none;">
        <h2>¡THE FINISH GAME!</h2>
        <p>Respuestas correctas: <span id="acertadas">0</span></p>
        <button id="reiniciar">Jugar de Nuevo</button>
    </section>

    <script src="js/script.js"></script>
</body>
</html>
